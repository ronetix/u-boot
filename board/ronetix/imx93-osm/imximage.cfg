/*
 * Based on arch/arm/mach-imx/imx9/imximage.cfg
 *
 * mx93-ahab-container.img is the ELE container for the CPU revision
 * selected with tools/imx_build_firmware.sh (CPU_REV=A0 or A1).
 */

BOOT_FROM SD 0x400
SOC_TYPE IMX9
APPEND mx93-ahab-container.img
CONTAINER
IMAGE A55 u-boot-spl-ddr.bin 0x2049A000
